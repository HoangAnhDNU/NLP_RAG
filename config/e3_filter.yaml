# Cau hinh E3: loc cung metadata cong ty/nam/ban bao cao truoc khi fusion.
# Giai thuyet khac E2: E2 chi cong diem mem (+0.15) nen van co the tra sai
# cong ty, sai nam, sai ban (separate thay cho consolidated). E3 loc cung
# pool ung vien theo metadata phat hien trong cau hoi, roi moi fusion
# BM25 + LSA tren pool da loc. Ky vong giam loi sai thuc the va cai thien
# MRR/citation tren 5 cau test co evidence.
corpus:
  chunks: data/processed/chunks.jsonl
  chunk_unit: page
  chunk_size: 1
  chunk_overlap: 0
model:
  dense_source: config/e1_tfidf.yaml
  dense_cache: evaluation/lsa_index_E1.npz
  seed: 42
retrieval:
  method: hard-filter-metadata-then-hybrid-bm25-lsa
  bm25_k1: 1.5
  bm25_b: 0.75
  tfidf_ngram: [1, 2]
  svd_components: 128
  fusion_alpha: 0.5
  candidate_k: 20
  top_k: 5
  fallback_min_pool: 5
  citation_fields: [company_id, fiscal_year, report_version, page, chunk_id]
refusal:
  enabled: true
  text: "Không đủ bằng chứng trong corpus để trả lời."
  patterns:
    - "quý"
    - "bán niên"
    - "6 tháng"
    - "kế hoạch"
    - "dự báo"
    - "giá đóng cửa"
    - "vốn hóa thị trường"
    - "thị giá"
    - "giá bán bình quân"
    - "tổng số cổ đông"
query:
  normalization: NFC-lower-strip
  use_question_as_is: true
date: 2026-11-10
