# Cấu hình E2: hybrid BM25 + dense LSA, lọc metadata công ty/năm, rerank, từ chối.
# Giả thuyết khác E1: kết hợp tín hiệu từ vựng (BM25) với tín hiệu ngữ nghĩa (LSA)
# cộng bộ lọc metadata theo mã CK và năm trong câu hỏi sẽ cải thiện MRR và
# citation correctness; quy tắc từ chối theo mẫu ngoài corpus sẽ tăng refusal rate.
corpus:
  chunks: data/processed/chunks.jsonl
  chunk_unit: page
  chunk_size: 1
  chunk_overlap: 0
model:
  dense_source: config/e1_tfidf.yaml
  dense_cache: evaluation/lsa_index_E1.npz
  seed: 42
retrieval:
  method: hybrid-bm25-plus-lsa-rerank-metadata
  bm25_k1: 1.5
  bm25_b: 0.75
  tfidf_ngram: [1, 2]
  svd_components: 128
  fusion_alpha: 0.5
  candidate_k: 20
  top_k: 5
  metadata_bonus: 0.15
  citation_fields: [company_id, fiscal_year, report_version, page, chunk_id]
refusal:
  enabled: true
  text: "Không đủ bằng chứng trong corpus để trả lời."
  patterns:
    - "quý"
    - "bán niên"
    - "6 tháng"
    - "kế hoạch"
    - "dự báo"
    - "dự kiến"
    - "giá đóng cửa"
    - "vốn hóa thị trường"
    - "thị giá"
    - "xếp hạng tín nhiệm"
    - "cổ tức trên cổ phiếu"
    - "giá cổ phiếu"
    - "giá bán bình quân"
    - "tổng số cổ đông"
    - "số lượng cổ đông"
query:
  normalization: NFC-lower-strip
  use_question_as_is: true
date: 2026-11-10
