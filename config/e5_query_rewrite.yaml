# Cau hinh E5: chuan hoa cau hoi, tach thuc the, sinh bien the truy van.
# Giai thuyet: cau tai chinh dai, nhieu cach goi chi tieu (doanh thu thuan =
# doanh thu ban hang). Max-pooling diem BM25/LSA tren cac bien the giup
# bat duoc chunk dung tu vung khac nhau truoc khi fusion nhu E2.
corpus:
  chunks: data/processed/chunks.jsonl
  chunk_unit: page
  chunk_size: 1
  chunk_overlap: 0
model:
  dense_source: config/e1_tfidf.yaml
  dense_cache: evaluation/lsa_index_E1.npz
  seed: 42
retrieval:
  method: query-rewrite-variants-then-hybrid
  bm25_k1: 1.5
  bm25_b: 0.75
  tfidf_ngram: [1, 2]
  svd_components: 128
  fusion_alpha: 0.5
  candidate_k: 20
  top_k: 5
  metadata_bonus: 0.15
  max_variants: 3
  variant_pooling: max
  citation_fields: [company_id, fiscal_year, report_version, page, chunk_id]
refusal:
  enabled: true
  text: "Không đủ bằng chứng trong corpus để trả lời."
  patterns:
    - "quý"
    - "bán niên"
    - "6 tháng"
    - "kế hoạch"
    - "dự báo"
    - "giá đóng cửa"
    - "vốn hóa thị trường"
    - "thị giá"
    - "giá bán bình quân"
    - "tổng số cổ đông"
query:
  normalization: NFC-lower-strip
  extract_company_year_metric: true
  generate_variants: true
date: 2026-11-10
