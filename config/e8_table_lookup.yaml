# Cau hinh E8: lookup co cau truc tren table_records truoc, RAG giai thich sau.
# Giai thuyet: cau so di qua lookup (company/nam/ban + khop chi tieu) truoc
# khi dung embedding se giam hallucination so lieu hon E2-E7 thuan retrieval.
corpus:
  chunks: data/processed/chunks.jsonl
  table_records: data/processed/table_records.jsonl
  chunk_unit: page
  chunk_size: 1
  chunk_overlap: 0
model:
  dense_source: config/e1_tfidf.yaml
  dense_cache: evaluation/lsa_index_E1.npz
  seed: 42
retrieval:
  method: structured-table-lookup-then-hybrid
  bm25_k1: 1.5
  bm25_b: 0.75
  tfidf_ngram: [1, 2]
  svd_components: 128
  candidate_k: 20
  top_k: 5
  metadata_bonus: 0.15
  lookup_min_score: 0.3
  citation_fields: [company_id, fiscal_year, report_version, page, chunk_id]
refusal:
  enabled: true
  text: "Không đủ bằng chứng trong corpus để trả lời."
  patterns:
    - "quý"
    - "bán niên"
    - "6 tháng"
    - "kế hoạch"
    - "dự báo"
    - "giá đóng cửa"
    - "vốn hóa thị trường"
    - "thị giá"
    - "giá bán bình quân"
    - "tổng số cổ đông"
query:
  normalization: NFC-lower-strip
  extract_company_year_metric: true
  structured_first: true
date: 2026-11-10
